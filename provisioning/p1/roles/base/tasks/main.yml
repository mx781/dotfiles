---
- name: Remove installer CD-only APT source
  ansible.builtin.file:
    path: /etc/apt/sources.list
    state: absent

- name: Configure Debian 13 APT archives
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/debian.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: http://deb.debian.org/debian
      Suites: trixie trixie-updates
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

      Types: deb
      URIs: http://security.debian.org/debian-security
      Suites: trixie-security
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

- name: Install APT and time synchronisation bootstrap packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - systemd-timesyncd
    state: present
    update_cache: true

- name: Enable network time synchronisation
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    enabled: true
    state: started

- name: Wait for network time synchronisation
  ansible.builtin.command: timedatectl show --property=NTPSynchronized --value
  register: ntp_synchronised
  changed_when: false
  until: ntp_synchronised.stdout == 'yes'
  retries: 12
  delay: 5

- name: Install firmware and core system packages
  ansible.builtin.apt:
    name:
      - firmware-iwlwifi
      - intel-microcode
      - linux-image-amd64
      - network-manager
      - sudo
    state: present
    update_cache: true

- name: Install base workstation packages
  ansible.builtin.apt:
    name:
      - acpi
      - alacritty
      - alsa-utils
      - arandr
      - bluetooth
      - build-essential
      - bzip2
      - ca-certificates
      - cmake
      - conky-std
      - curl
      - dmenu
      - ffmpeg
      - feh
      - fontconfig
      - fonts-firacode
      - fzf
      - git
      - htop
      - maim
      - ncdu
      - nnn
      - pcmanfm
      - pavucontrol
      - pinentry-qt
      - pipewire
      - pipewire-pulse
      - powertop
      - psmisc
      - ripgrep
      - rsync
      - scrot
      - tmux
      - unzip
      - wget
      - wireplumber
      - wmctrl
      - xclip
      - xdg-utils
      - xinit
      - xorg
      - xsecurelock
      - vlc
    state: present
    update_cache: true

- name: Enable time synchronisation
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    enabled: true
    state: started

- name: Enable Bluetooth
  ansible.builtin.systemd_service:
    name: bluetooth.service
    enabled: true

- name: Check for the P1 encrypted-root swapfile
  ansible.builtin.stat:
    path: /swapfile
  register: p1_swapfile

- name: Create the P1 swapfile
  ansible.builtin.command:
    cmd: "fallocate --length {{ p1_swapfile_size_mb }}M /swapfile"
  when: not p1_swapfile.stat.exists

- name: Restrict swapfile permissions
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: '0600'

- name: Initialise a newly created swapfile
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when: not p1_swapfile.stat.exists

- name: Persist the P1 swapfile mount
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'
    create: false

- name: Check active swap devices
  ansible.builtin.command:
    cmd: swapon --noheadings --output NAME
  register: p1_active_swap
  changed_when: false

- name: Enable the P1 swapfile
  ansible.builtin.command:
    cmd: swapon /swapfile
  when: "'/swapfile' not in p1_active_swap.stdout_lines"

- name: Expose Powertop to normal user PATHs
  ansible.builtin.file:
    src: /usr/sbin/powertop
    dest: /usr/local/bin/powertop
    state: link
    force: true
