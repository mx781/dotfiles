---
# The Slack .deb's postinst adds this Packagecloud source itself (the apps
# role reinstates the removal after each Slack install for that reason). Its
# signing key uses SHA-1, which Debian 13's apt rejects outright, so a leftover
# copy from any earlier run breaks every apt cache update that follows -
# including this role's own, which is the very first one in the play. Remove
# it here, ahead of any update_cache, regardless of which tags are requested.
- name: Remove obsolete Slack Packagecloud repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/slack.list
    state: absent

- name: Remove installer CD-only APT source
  ansible.builtin.file:
    path: /etc/apt/sources.list
    state: absent

- name: Configure Debian 13 APT archives
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/debian.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: https://deb.debian.org/debian
      Suites: trixie trixie-updates
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

      Types: deb
      URIs: https://security.debian.org/debian-security
      Suites: trixie-security
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

- name: Install APT and time synchronisation bootstrap packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - systemd-timesyncd
    state: present
    update_cache: true

- name: Enable network time synchronisation
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    enabled: true
    state: started

- name: Wait for network time synchronisation
  ansible.builtin.command: timedatectl show --property=NTPSynchronized --value
  register: ntp_synchronised
  changed_when: false
  until: ntp_synchronised.stdout == 'yes'
  retries: 12
  delay: 5

- name: Install firmware and core system packages
  ansible.builtin.apt:
    name:
      - firmware-iwlwifi
      - intel-microcode
      - linux-image-amd64
      - network-manager
      - nvme-cli
      - smartmontools
      - sudo
    state: present
    update_cache: true

- name: Grant the principal user sudo access
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: sudo
    append: true

- name: Install base workstation packages
  ansible.builtin.apt:
    name:
      - acpi
      - age
      - alacritty
      - alsa-utils
      - arandr
      - bluetooth
      - build-essential
      - bzip2
      - ca-certificates
      - cmake
      - conky-std
      - curl
      - dmenu
      - ffmpeg
      - feh
      - fontconfig
      - fonts-firacode
      - fzf
      - git
      - htop
      - maim
      - ncdu
      - nnn
      - pcmanfm
      - pavucontrol
      - pinentry-qt
      - pipewire
      - pipewire-pulse
      - powertop
      - psmisc
      - ripgrep
      - rsync
      - scrot
      - tmux
      - unzip
      - wget
      - wireplumber
      - wmctrl
      - xclip
      - xdg-utils
      - xinit
      - xorg
      - xsecurelock
      - vlc
    state: present
    update_cache: true

- name: Enable time synchronisation
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    enabled: true
    state: started

- name: Enable Bluetooth
  ansible.builtin.systemd_service:
    name: bluetooth.service
    enabled: true

- name: Check for the P1 encrypted-root swapfile
  ansible.builtin.stat:
    path: /swapfile
  register: p1_swapfile

- name: Create the P1 swapfile
  ansible.builtin.command:
    cmd: "fallocate --length {{ p1_swapfile_size_mb }}M /swapfile"
  when: not p1_swapfile.stat.exists

- name: Restrict swapfile permissions
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: '0600'

- name: Initialise a newly created swapfile
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when: not p1_swapfile.stat.exists

- name: Persist the P1 swapfile mount
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'
    create: false

- name: Check active swap devices
  ansible.builtin.command:
    cmd: swapon --noheadings --show=NAME
  register: p1_active_swap
  changed_when: false

- name: Enable the P1 swapfile
  ansible.builtin.command:
    cmd: swapon /swapfile
  when: "'/swapfile' not in p1_active_swap.stdout_lines"

- name: Expose Powertop to normal user PATHs
  ansible.builtin.file:
    src: /usr/sbin/powertop
    dest: /usr/local/bin/powertop
    state: link
    force: true
