---
# The Slack .deb's postinst adds this Packagecloud source itself (the apps
# role reinstates the removal after each Slack install for that reason). Its
# signing key uses SHA-1, which newer Debian apt rejects, so a leftover
# copy from any earlier run breaks every apt cache update that follows -
# including this role's own, which is the very first one in the play. Remove
# it here, ahead of any update_cache, regardless of which tags are requested.
- name: Remove obsolete Slack Packagecloud repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/slack.list
    state: absent
  tags: [always]

- name: Remove installer CD-only APT source
  ansible.builtin.file:
    path: /etc/apt/sources.list
    state: absent

- name: Configure Debian APT archives
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/debian.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: https://deb.debian.org/debian
      Suites: {{ workstation_debian_suites | join(' ') }}
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

      Types: deb
      URIs: https://security.debian.org/debian-security
      Suites: {{ ansible_distribution_release }}-security
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

- name: Install APT and time synchronisation bootstrap packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - systemd-timesyncd
    state: present
    update_cache: true

- name: Enable network time synchronisation
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    enabled: true
    state: started

- name: Wait for network time synchronisation
  ansible.builtin.command: timedatectl show --property=NTPSynchronized --value
  register: ntp_synchronised
  changed_when: false
  until: ntp_synchronised.stdout == 'yes'
  retries: 12
  delay: 5

- name: Install firmware and core system packages
  ansible.builtin.apt:
    name:
      - firmware-iwlwifi
      - intel-microcode
      - linux-image-amd64
      - network-manager
      - nvme-cli
      - smartmontools
      - sudo
    state: present
    update_cache: true

# A valid global default domain makes NetworkManager ignore the name servers
# and search domains every connection hands out over DHCP, on any network.
# Tailscale forwards non-tailnet queries to whatever NetworkManager writes, so
# MagicDNS keeps working on top. glibc reads at most three name servers.
- name: Pin public DNS resolvers for every network
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/80-pinned-dns.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [global-dns-domain-*]
      servers={{ workstation_dns_servers | join(',') }}
  register: pinned_dns
  tags: [dns]

- name: Reload NetworkManager DNS configuration without reconnecting Wi-Fi
  ansible.builtin.command: nmcli general reload conf,dns-full
  when: pinned_dns is changed
  changed_when: true
  tags: [dns]

- name: Grant the principal user sudo access
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: sudo
    append: true

- name: Install Bubblewrap for application sandboxing
  ansible.builtin.apt:
    name: bubblewrap
    state: present
    update_cache: true
  tags: [bubblewrap]

- name: Install base workstation packages
  ansible.builtin.apt:
    name:
      - acpi
      - age
      - alacritty
      - alsa-utils
      - arandr
      - bluetooth
      - build-essential
      - bzip2
      - ca-certificates
      - cmake
      - conky-std
      - curl
      - dmenu
      - dunst
      - ffmpeg
      - feh
      - fontconfig
      - fonts-firacode
      - fonts-noto-color-emoji
      - fzf
      - git
      - htop
      - maim
      # Debian ships the traditional "cal" binary in ncal, not util-linux.
      - ncal
      - ncdu
      - nnn
      - pcmanfm
      - pavucontrol
      - pinentry-qt
      - pipewire
      - pipewire-alsa
      - pipewire-pulse
      - powertop
      - psmisc
      - rclone
      - ripgrep
      - rsync
      - scrot
      - tlp
      - tmux
      - unzip
      - wget
      - wireplumber
      - wmctrl
      - xclip
      - python3-pil
      - xdg-utils
      - xinit
      - xorg
      - xsecurelock
      - xss-lock
      - vlc
    state: present
    update_cache: true

- name: Enable time synchronisation
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    enabled: true
    state: started

- name: Enable Bluetooth
  ansible.builtin.systemd_service:
    name: bluetooth.service
    enabled: true

# TLP ships with no charge thresholds: its defaults leave the battery to
# charge to 100% and sit there, because capping charge trades runtime for
# lifespan and that is the owner's call. On a laptop that mostly sits on AC,
# holding a lithium cell at full voltage is what ages it, so cap at 80% and
# only resume charging below 75% (the gap stops constant top-up cycling).
# For a day away from the dock, `sudo tlp fullcharge` charges to 100% once;
# the thresholds come back at the next reboot or `sudo tlp setcharge`.
# Hardware without threshold support just ignores these.
- name: Cap battery charge to preserve battery life
  ansible.builtin.copy:
    dest: /etc/tlp.d/20-charge-thresholds.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible (base role).
      START_CHARGE_THRESH_BAT0=75
      STOP_CHARGE_THRESH_BAT0=80
  register: tlp_charge_thresholds

- name: Enable TLP power management
  ansible.builtin.systemd_service:
    name: tlp.service
    enabled: true
    state: "{{ 'restarted' if tlp_charge_thresholds is changed else 'started' }}"

- name: Check for the workstation swapfile
  ansible.builtin.stat:
    path: /swapfile
  register: workstation_swapfile

- name: Create the workstation swapfile
  ansible.builtin.command:
    cmd: "fallocate --length {{ workstation_swapfile_size_mb }}M /swapfile"
  when: not workstation_swapfile.stat.exists

- name: Restrict swapfile permissions
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: '0600'

- name: Initialise a newly created swapfile
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when: not workstation_swapfile.stat.exists

- name: Persist the workstation swapfile mount
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'
    create: false

- name: Check active swap devices
  ansible.builtin.command:
    cmd: swapon --noheadings --show=NAME
  register: workstation_active_swap
  changed_when: false

- name: Enable the workstation swapfile
  ansible.builtin.command:
    cmd: swapon /swapfile
  when: "'/swapfile' not in workstation_active_swap.stdout_lines"

- name: Expose Powertop to normal user PATHs
  ansible.builtin.file:
    src: /usr/sbin/powertop
    dest: /usr/local/bin/powertop
    state: link
    force: true
