---
- name: Create APT keyring directory for application repositories
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install Brave signing key and repository definition
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.dest }}"
    mode: '0644'
  loop:
    - { url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg, dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg }
    - { url: https://brave-browser-apt-release.s3.brave.com/brave-browser.sources, dest: /etc/apt/sources.list.d/brave-browser-release.sources }

- name: Install Mozilla signing key
  ansible.builtin.get_url:
    url: https://packages.mozilla.org/apt/repo-signing-key.gpg
    dest: /etc/apt/keyrings/packages.mozilla.org.asc
    mode: '0644'

- name: Configure Mozilla Firefox repository and priority
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    mode: '0644'
    content: "{{ item.content }}"
  loop:
    - dest: /etc/apt/sources.list.d/mozilla.list
      content: "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main\n"
    - dest: /etc/apt/preferences.d/mozilla
      content: |
        Package: *
        Pin: origin packages.mozilla.org
        Pin-Priority: 1000

- name: Install Gopass repository signing key
  ansible.builtin.get_url:
    url: https://packages.gopass.pw/repos/gopass/gopass-archive-keyring.gpg
    dest: /usr/share/keyrings/gopass-archive-keyring.gpg
    mode: '0644'

- name: Configure Gopass repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/gopass.sources
    mode: '0644'
    content: |
      Types: deb
      URIs: https://packages.gopass.pw/repos/gopass
      Suites: stable
      Components: main
      Architectures: amd64 arm64 armhf
      Signed-By: /usr/share/keyrings/gopass-archive-keyring.gpg

- name: Install Tailscale signing key and repository definition
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.dest }}"
    mode: '0644'
  loop:
    - { url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg", dest: /usr/share/keyrings/tailscale-archive-keyring.gpg }
    - { url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.tailscale-keyring.list", dest: /etc/apt/sources.list.d/tailscale.list }

- name: Install desktop applications from APT
  ansible.builtin.apt:
    name:
      - brave-browser
      - chromium
      - firefox
      - "{{ 'freerdp2-x11' if ansible_distribution_release == 'bookworm' else 'freerdp3-x11' }}"
      - gopass
      - gopass-archive-keyring
      - libreoffice
      - poppler-utils
      - qbittorrent
      - redshift
      - tailscale
    state: present
    update_cache: true

- name: Enable and start tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

# Note: "tailscale up" resets prefs that aren't passed as flags, so running
# it without --operator=<user> silently wipes this setting. Authenticate with
# "tailscale up --operator=<user>", or re-run this role to restore it.
- name: Check current Tailscale operator
  ansible.builtin.command: tailscale debug prefs
  register: workstation_tailscale_prefs
  changed_when: false

- name: Allow the main user to operate Tailscale without sudo
  ansible.builtin.command: "tailscale set --operator={{ target_user }}"
  when: (workstation_tailscale_prefs.stdout | from_json).OperatorUser | default('') != target_user
  changed_when: true

- name: Configure Redshift AppArmor access to repo-linked settings
  ansible.builtin.import_tasks: redshift-apparmor.yml
  tags: [redshift-apparmor]

# - Chromium's xdg-desktop-portal secret storage silently fails without a
#   portal or GNOME/KDE session, so pin the keyless "basic" store instead.
# - Chromium's AccountReconcilor calls Google's /Logout endpoint on every
#   startup because no account is signed into the browser itself (only the
#   website), which it treats as a mismatch to fix. --disable-sync turns
#   off the identity service that drives this, confirmed via net-log
#   capture across repeated restarts.
- name: Work around Chromium session-cookie storage issues
  ansible.builtin.copy:
    dest: /etc/chromium.d/99-password-store
    mode: '0644'
    content: |
      CHROMIUM_FLAGS="$CHROMIUM_FLAGS --password-store=basic"
      CHROMIUM_FLAGS="$CHROMIUM_FLAGS --disable-sync"

- name: Check whether Telegram Desktop is already installed
  ansible.builtin.stat:
    path: /opt/Telegram/Telegram
  register: workstation_telegram

- name: Download Telegram Desktop archive
  ansible.builtin.get_url:
    url: https://telegram.org/dl/desktop/linux
    dest: "/var/cache/{{ workstation_profile }}-telegram.tar.xz"
    mode: '0644'
  when: not workstation_telegram.stat.exists

- name: Install Telegram Desktop
  ansible.builtin.unarchive:
    src: "/var/cache/{{ workstation_profile }}-telegram.tar.xz"
    dest: /opt
    remote_src: true
    creates: /opt/Telegram/Telegram

- name: Link Telegram Desktop executable
  ansible.builtin.file:
    src: /opt/Telegram/Telegram
    dest: /usr/local/bin/Telegram
    state: link

- name: Download Slack Debian package
  ansible.builtin.get_url:
    url: https://downloads.slack-edge.com/desktop-releases/linux/x64/4.50.143/slack-desktop-4.50.143-amd64.deb
    dest: "/var/cache/{{ workstation_profile }}-slack.deb"
    mode: '0644'

- name: Install Slack
  ansible.builtin.apt:
    deb: "/var/cache/{{ workstation_profile }}-slack.deb"

# Slack's postinst re-adds the repository the base role already removed.
- name: Keep Slack's obsolete Packagecloud repository disabled
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/slack.list
    state: absent

- name: Download Blender 5.1.2 stable release
  ansible.builtin.get_url:
    url: https://download.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz
    dest: "/var/cache/{{ workstation_profile }}-blender-5.1.2-linux-x64.tar.xz"
    mode: '0644'

- name: Install Blender 5.1.2 stable release
  ansible.builtin.unarchive:
    src: "/var/cache/{{ workstation_profile }}-blender-5.1.2-linux-x64.tar.xz"
    dest: /opt
    remote_src: true
    creates: /opt/blender-5.1.2-linux-x64/blender

- name: Make Blender available system-wide
  ansible.builtin.file:
    src: /opt/blender-5.1.2-linux-x64/blender
    dest: /usr/local/bin/blender
    state: link

# Debian 13 ships rclone 1.60.1; the upstream package tracks current backends.
- name: Download rclone 1.75.2 Debian package
  ansible.builtin.get_url:
    url: https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.deb
    dest: /var/cache/p1-rclone-1.75.2-linux-amd64.deb
    mode: '0644'

- name: Install rclone 1.75.2
  ansible.builtin.apt:
    deb: /var/cache/p1-rclone-1.75.2-linux-amd64.deb
