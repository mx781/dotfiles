# Pucc's user-facing camera is an OmniVision OV02E10 (ACPI OVTI02E1) behind
# the Meteor Lake IPU6 and the Intel Visual Sensing Controller. Debian 13's
# 6.12 kernel already ships every other piece: the IPU6 ISYS driver, IVSC,
# the LJCA USB bridge for sensor GPIOs, ipu_bridge's OVTI02E1 entry, and the
# IPU6/IVSC firmware. Only the sensor driver is missing; it was mainlined in
# Linux 6.16. Building that one file out of tree keeps the stock kernel and
# with it the Debian NVIDIA and EVDI DKMS modules, which do not all build on
# the newer backports kernel.
#
# The ISYS only delivers raw Bayer frames; libcamera's simple pipeline with
# its software ISP turns them into usable video. Applications get it through
# a v4l2loopback device fed by the `webcam` user service, not PipeWire's
# libcamera plugin:
# - The software ISP crops rather than scales smaller requested sizes, so a
#   browser asking for 640x480 got a 2-3x zoomed centre of the sensor.
#   The relay always captures the full 1920x1080 and scales to 1280x720.
# - libcamera 0.4 dies with SIGFPE in its AGC for some sizes (640x360, which
#   Chromium requests); inside PipeWire that took the audio graph down too.
# - Electron apps and Chromium without flags only speak V4L2.
# With exclusive_caps the device advertises capture only while the relay
# runs, so applications list "Pucc Webcam" exactly when it delivers frames.
# Start it with `systemctl --user start webcam` and stop it after the call;
# the sensor, its LED, and about half a core stay busy while it runs.
#
# The relay uses a patched libcamera 0.7.2 in /opt/libcamera-pucc rather than
# Debian's 0.4, whose AGC hunted and blew out highlights on this sensor:
# - libcamera has no OV02E10 data. Measured against the CSI-2 frame start
#   events, exposure lands 4 frames and gain 3 frames after being written
#   (libcamera assumed 2 and 1); gain is code/16 and black level 64.
# - The AGC now steps from its commanded values and waits until a frame shows
#   them, instead of rescaling stale readbacks, which made it oscillate.
# - It meters highlights as well as the mean, so a lit face in a dark room is
#   not clipped, and aims slightly below mid grey.

- name: Install DKMS, kernel headers, the webcam relay, and libcamera build tools
  ansible.builtin.apt:
    name:
      - dkms
      - linux-headers-amd64
      - v4l-utils
      - v4l2loopback-dkms
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-tools
      - meson
      - ninja-build
      - pkg-config
      - patch
      - python3-jinja2
      - python3-ply
      - python3-yaml
      - libyaml-dev
      - libssl-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
    state: present
    install_recommends: false

# Debian's plugin registers the same libcamerasrc element against libcamera 0.4.
- name: Remove Debian's libcamera GStreamer plugin
  ansible.builtin.apt:
    name: gstreamer1.0-libcamera
    state: absent

- name: Create the patched libcamera source directory
  ansible.builtin.file:
    path: /usr/local/src/libcamera-pucc
    state: directory
    mode: '0755'

- name: Download the libcamera 0.7.2 source
  ansible.builtin.get_url:
    url: https://deb.debian.org/debian/pool/main/libc/libcamera/libcamera_0.7.2.orig.tar.gz
    dest: /usr/local/src/libcamera-pucc/libcamera_0.7.2.orig.tar.gz
    checksum: sha256:e27f5670fe9443eebc8e2f24235cd20b533324ef481a3684d34c78f1c3a12afb
    mode: '0644'

- name: Copy the OV02E10 and AGC libcamera patch
  ansible.builtin.copy:
    src: libcamera-0.7.2-pucc-ov02e10.patch
    dest: /usr/local/src/libcamera-pucc/libcamera-0.7.2-pucc-ov02e10.patch
    mode: '0644'

# Rebuilds only when the source tarball or the patch changes.
- name: Build and install patched libcamera into /opt/libcamera-pucc
  ansible.builtin.shell:
    executable: /bin/sh
    chdir: /usr/local/src/libcamera-pucc
    cmd: |
      set -eu
      prefix=/opt/libcamera-pucc
      want=$(sha256sum libcamera_0.7.2.orig.tar.gz libcamera-0.7.2-pucc-ov02e10.patch | cut -d' ' -f1 | tr '\n' ' ')
      if [ -f "$prefix/.build-inputs" ] && [ "$(cat "$prefix/.build-inputs")" = "$want" ]; then
        exit 0
      fi
      rm -rf src build
      mkdir src
      tar -xzf libcamera_0.7.2.orig.tar.gz -C src --strip-components=1
      patch -d src -p1 < libcamera-0.7.2-pucc-ov02e10.patch
      meson setup build src --prefix="$prefix" --buildtype=release \
        -Dpipelines=simple -Dipas=simple -Dgstreamer=enabled -Dsoftisp-gpu=disabled \
        -Dcam=disabled -Dqcam=disabled -Dv4l2=disabled -Dlc-compliance=disabled \
        -Ddocumentation=disabled -Dpycamera=disabled -Dtracing=disabled \
        -Dudev=disabled -Dlibdw=disabled -Dlibunwind=disabled -Dandroid=disabled
      ninja -C build
      rm -rf "$prefix"
      meson install -C build
      echo "$want" > "$prefix/.build-inputs"
      echo rebuilt
  register: workstation_libcamera_build
  changed_when: "'rebuilt' in workstation_libcamera_build.stdout"
  when: not ansible_check_mode

- name: Create the OV02E10 DKMS source directory
  ansible.builtin.file:
    path: /usr/src/ov02e10-6.16
    state: directory
    mode: '0755'

- name: Download the mainline v6.16 OV02E10 sensor driver
  ansible.builtin.get_url:
    url: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/drivers/media/i2c/ov02e10.c?h=v6.16
    dest: /usr/src/ov02e10-6.16/ov02e10.c
    checksum: sha256:236e3fa27354bcad26f0accf8bf093051800f120cc62e8933a691bbaea3a8925
    mode: '0644'
  register: workstation_ov02e10_source

# Kernels from 6.16 carry the driver in tree, so DKMS skips them.
- name: Configure the OV02E10 DKMS module
  ansible.builtin.copy:
    dest: "/usr/src/ov02e10-6.16/{{ item.name }}"
    mode: '0644'
    content: "{{ item.content }}"
  loop:
    - name: Makefile
      content: |
        obj-m := ov02e10.o
    - name: dkms.conf
      content: |
        PACKAGE_NAME="ov02e10"
        PACKAGE_VERSION="6.16"
        BUILT_MODULE_NAME[0]="ov02e10"
        DEST_MODULE_LOCATION[0]="/updates/dkms"
        MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
        BUILD_EXCLUSIVE_KERNEL="^6\.1[2-5]\."
        AUTOINSTALL="yes"
  loop_control:
    label: "{{ item.name }}"
  register: workstation_ov02e10_config

- name: Build and install OV02E10 for every kernel with headers
  ansible.builtin.shell:
    executable: /bin/sh
    cmd: |
      set -eu
      if [ "{{ (workstation_ov02e10_source is changed or workstation_ov02e10_config is changed) | lower }}" = true ]; then
        /usr/sbin/dkms remove ov02e10/6.16 --all >/dev/null 2>&1 || true
      fi
      /usr/sbin/dkms status ov02e10/6.16 | grep -q . || /usr/sbin/dkms add ov02e10/6.16
      for build in /lib/modules/*/build; do
        kernel=${build#/lib/modules/}
        kernel=${kernel%/build}
        case $kernel in 6.1[2-5].*) ;; *) continue ;; esac
        /usr/sbin/dkms status ov02e10/6.16 -k "$kernel" | grep -q ': installed' && continue
        /usr/sbin/dkms install ov02e10/6.16 -k "$kernel"
        echo "installed for $kernel"
      done
  register: workstation_ov02e10_dkms
  changed_when: "'installed for' in workstation_ov02e10_dkms.stdout"
  when: not ansible_check_mode

- name: Load the OV02E10 driver on the running kernel
  ansible.builtin.command:
    argv: [/usr/sbin/modprobe, ov02e10]
  changed_when: false
  when:
    - not ansible_check_mode
    - ansible_kernel is match('6\.1[2-5]\.')

# video60 keeps the loopback clear of the IPU6's 48 ISYS capture nodes.
- name: Configure the webcam loopback device
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    mode: '0644'
    content: "{{ item.content }}"
  loop:
    - dest: /etc/modprobe.d/pucc-webcam.conf
      content: |
        options v4l2loopback devices=1 video_nr=60 card_label="Pucc Webcam" exclusive_caps=1
    - dest: /etc/modules-load.d/pucc-webcam.conf
      content: |
        v4l2loopback
  loop_control:
    label: "{{ item.dest }}"

- name: Load the webcam loopback device
  ansible.builtin.command:
    argv: [/usr/sbin/modprobe, v4l2loopback]
  changed_when: false
  when: not ansible_check_mode

- name: Install the webcam relay user service
  ansible.builtin.copy:
    dest: /etc/systemd/user/webcam.service
    mode: '0644'
    content: |
      [Unit]
      Description=Relay the IPU6 camera to the Pucc Webcam loopback device

      [Service]
      Environment=LD_LIBRARY_PATH=/opt/libcamera-pucc/lib/x86_64-linux-gnu
      Environment=GST_PLUGIN_PATH=/opt/libcamera-pucc/lib/x86_64-linux-gnu/gstreamer-1.0
      ExecStart=/usr/bin/gst-launch-1.0 -e libcamerasrc ! video/x-raw,width=1920,height=1080 ! videoconvert n-threads=4 ! videoscale n-threads=4 ! video/x-raw,format=YUY2,width=1280,height=720 ! v4l2sink device=/dev/video60 sync=false
