---
- name: Provision a local workstation profile
  hosts: workstation
  gather_facts: true
  become: true
  vars:
    workstation_profile: ''
    target_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"
    dotfiles_repo: "{{ lookup('env', 'HOME') }}/hub/dotfiles"
  pre_tasks:
    - name: Require a known workstation profile
      ansible.builtin.assert:
        that: workstation_profile in ['p1', 'pucc']
        fail_msg: Pass -e workstation_profile=p1 or -e workstation_profile=pucc.
      tags: [always]

    - name: Load workstation profile
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/profiles/{{ workstation_profile }}.yml"
      tags: [always]

    - name: Require the profile's Debian release
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Debian'
          - ansible_distribution_release == workstation_debian_release
        fail_msg: >-
          {{ workstation_name }} currently requires Debian
          {{ workstation_debian_version }} ({{ workstation_debian_release }}),
          not {{ ansible_distribution }} {{ ansible_distribution_release }}.
      tags: [always]

    - name: Require an existing target user
      ansible.builtin.getent:
        database: passwd
        key: "{{ target_user }}"
      tags: [always]

    - name: Get target user home directory
      ansible.builtin.set_fact:
        target_home: "{{ getent_passwd[target_user][4] }}"
      tags: [always]

    - name: Require a dotfiles checkout
      ansible.builtin.stat:
        path: "{{ dotfiles_repo }}/.git"
      register: dotfiles_git
      tags: [always]

    - name: Stop if dotfiles checkout is missing
      ansible.builtin.assert:
        that: dotfiles_git.stat.exists
        fail_msg: "dotfiles_repo is not a Git checkout: {{ dotfiles_repo }}"
      tags: [always]

  roles:
    - role: base
      tags: [base]
    - role: storage
      when: workstation_storage_enabled
      tags: [storage]
    - role: nvidia
      when: workstation_nvidia_enabled
      tags: [nvidia]
    - role: drivers
      tags: [drivers]
    - role: backlight
      when: workstation_backlight_enabled
      tags: [backlight, drivers]
    - role: desktop
      tags: [desktop]
    - role: developer
      tags: [developer]
    - role: dotfiles
      tags: [dotfiles]
    - role: xmonad
      tags: [xmonad]
    - role: apps
      tags: [apps]
    - role: personal
      tags: [personal]
