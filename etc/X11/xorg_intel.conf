# no https://forum.endeavouros.com/t/xrandr-doesnt-detect-my-internal-laptop-monitor/26467/19
# 10/11/2023 urra bleg
#

Section "Monitor"
    Identifier	"asus"
    Option "Primary" "true"
EndSection

Section "ServerLayout"
    Identifier     "Layout0"
    Screen      0  "laptop" 0 0
    InputDevice    "Keyboard0" "CoreKeyboard"
    InputDevice    "Mouse0" "CorePointer"
    Option         "Xinerama" "0"
EndSection

Section "Files"
EndSection

Section "InputDevice"

    # generated from default
    Identifier     "Mouse0"
    Driver         "mouse"
    Option         "Protocol" "auto"
    Option         "Device" "/dev/psaux"
    Option         "Emulate3Buttons" "no"
    Option         "ZAxisMapping" "4 5"
EndSection

Section "InputDevice"
    Identifier     "Keyboard0"
    Driver         "kbd"
EndSection
Section "Device"
    Identifier	"Intel Graphics"
    Driver	"intel"
    BusID	"PCI:00:02:0"
    Option	"DRI"	"iris"
    Option	"TearFree"	"false"
    Option	"TripleBuffer"	"false"
    Option	"SwapbufersWait"	"false"
    # Option	"Monitor-eDP1" "asus"
    Option	"AccelMethod"	"uxa"
    # todo: try out "sna" or "blt" if tearing happens
EndSection


Section "Screen"
    Identifier     "laptop"
    Device         "intel"
    Monitor        "asus"
EndSection


