# 10/11/2023 urra bleg
#
Section "ServerLayout"
    Identifier     "Layout0"
    Screen      0  "lg" 0 0
    InputDevice    "Keyboard0" "CoreKeyboard"
    InputDevice    "Mouse0" "CorePointer"
    Option         "Xinerama" "0"
EndSection

Section "Files"
EndSection

Section "InputDevice"

    # generated from default
    Identifier     "Mouse0"
    Driver         "mouse"
    Option         "Protocol" "auto"
    Option         "Device" "/dev/psaux"
    Option         "Emulate3Buttons" "no"
    Option         "ZAxisMapping" "4 5"
EndSection

Section "InputDevice"
    Identifier     "Keyboard0"
    Driver         "kbd"
EndSection

Section "Monitor"
    Identifier     "hdmi"
    VendorName     "Unknown"
    ModelName      "LG Electronics LG ULTRAWIDE"
    Option "Primary" "true"
    Option         "DPMS"
EndSection

Section "Monitor"
    Identifier	"asus"
    Option "Primary" "false"
EndSection

Section "Device"
    Identifier	"intel"
    Driver	"intel"
    BusID	"PCI:00:02:0"
    Option	"Monitor-eDP1" "asus"
EndSection

Section "Device"
    Identifier     "nvidia"
    Driver         "nvidia"
    VendorName     "NVIDIA Corporation"
    BoardName      "NVIDIA GeForce RTX 2070"
    BusID          "PCI:01:00:0"
    Option	"Monitor-HDMI0" "hdmi"
EndSection

Section "Screen"
    Identifier     "laptop"
    Device         "intel"
    Monitor        "asus"
EndSection


Section "Screen"
    Identifier     "lg"
    Device         "nvidia"
    Monitor        "hdmi"
    DefaultDepth    24
    SubSection     "Display"
        Depth       24
    EndSubSection
EndSection
